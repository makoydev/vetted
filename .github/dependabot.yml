version: 2
updates:
  # Keeps SHA-pinned Actions current; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    ignore:
      # Types must match the node24 runtime; TypeScript majors are upgraded
      # deliberately, not by bot (see RISKS.md R10).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
