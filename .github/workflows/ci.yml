name: CI

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run ci-test

  check-dist:
    name: Check dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist
        run: npm run package

      # dist/ is what runners execute, so it must match the reviewed source.
      - name: Compare dist with committed version
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "dist/ is out of date. Run 'npm run package' and commit the result."
            git diff --ignore-space-at-eol --stat dist/
            exit 1
          fi

      - name: Upload expected dist
        if: ${{ failure() && steps.diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expected-dist
          path: dist/

  run-action:
    name: Run action
    runs-on: ubuntu-latest
    # Vetted reads the pull request's files through the API. No write access
    # and no API key here, so it runs in shadow mode on the mock.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Vetted in shadow mode
        id: vetted
        uses: ./
        with:
          mode: shadow

      - name: Check reported mode
        run: test "${{ steps.vetted.outputs.mode }}" = "shadow"
