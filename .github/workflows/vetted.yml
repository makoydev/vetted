name: Vetted

# Vetted reviews its own pull requests. It is pinned to an already-merged
# commit on `next`, never `uses: ./`: running the pull request's own code
# with write access and the API key would let the code under review decide
# how it is reviewed. The pin is bumped by pull request as Vetted evolves.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: Vetted review
    runs-on: ubuntu-latest
    steps:
      - name: Vetted AI Code Review
        uses: makoydev/vetted@2ae958e0fbf14fb9c74c2423059a49762927a192 # v0.1.0
        with:
          # Opt-in since #9: add the `ai-review` label to get comments.
          mode: opt-in
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
